plugins {
    id 'com.android.application'
}

android {
    namespace 'com.autoradio.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.autoradio.launcher'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Only keep French + English resources to shrink the APK
        resourceConfigurations += ['fr', 'en']
    }

    buildTypes {
        release {
            // Strip unused code/resources: smaller APK, less RAM
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Personal sideload build: signed with the debug key so it installs directly
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies on purpose: no AndroidX, no Kotlin stdlib -> tiny footprint.
